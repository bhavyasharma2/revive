name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r requirements-demo.txt
      - name: Run tests (no API keys needed)
        run: pytest
      - name: Sandbox test as root (uploaded notebooks must not see the server's secrets)
        run: |
          sudo useradd --create-home --shell /usr/sbin/nologin revivesbx
          sudo env "PATH=$PATH" python -m pytest tests/test_sandbox.py -v
