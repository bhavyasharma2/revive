[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "revive-nb"
version = "0.1.0"
description = "Agent that revives broken ML notebooks and proves the fix by comparing re-executed outputs with the originals."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "nbformat>=5.9",
    "nbclient>=0.9",
    "ipykernel>=6.29",
    "openai>=1.40",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "uv>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "numpy", "pandas", "scikit-learn"]

[tool.setuptools.packages.find]
include = ["revive*"]

[tool.setuptools.package-data]
"revive.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
